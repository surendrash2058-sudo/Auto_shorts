name: Daily What-If Short

on:
  workflow_dispatch:
  schedule:
    # Two daily uploads: 6 PM and 9 PM US Eastern (standard time).
    # During US daylight time, these run one hour later by local clock.
    - cron: "7 23 * * *"
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: daily-what-if-short
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate and upload one video
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PRIVACY: public
          VISUALS: auto
        run: python auto_shorts.py --auto

      - name: Persist completed topic history
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.json
          if ! git diff --cached --quiet; then
            git commit -m "Record generated What If topic"
            git pull --rebase origin main
            git push
          fi

      - name: Upload generated video as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-shorts-output
          path: output/
          if-no-files-found: ignore
          retention-days: 7
