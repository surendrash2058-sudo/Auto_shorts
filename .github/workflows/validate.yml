name: Auto Shorts Code Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-short:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Shorts Python syntax
        run: python -m py_compile auto_shorts.py youtube_auth.py

      - name: Check Shorts workflow command
        run: python auto_shorts.py --help
